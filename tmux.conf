# =================================================================
# ANALYST TMUX CONFIG (XPS Minimalist Grey Aesthetic)
# =================================================================

# Change the prefix to Ctrl-a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Enable the mouse
set -g mouse on

# Set vi selection mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# --- CLIPBOARD INTEGRATION ---
bind C-c choose-buffer "run \"tmux save-buffer -b '%%' - | xsel -i -b\""
bind C-v run "xsel -o -b | tmux load-buffer - && tmux paste-buffer"

# --- THEME / VISUALS (Grey/Silver Palette) ---
# Colors:
# Background: #1e1e1e (Dark Grey)
# Accent:     #a0a0a0 (Satin Silver)
# Sub-text:   #4a4a4a (Mid Grey)

# Status bar background/foreground
set -g status-style bg="#1e1e1e",fg="#a0a0a0"

# Left side: Session name (Silver block with black text)
set -g status-left '#[fg=#000000,bg=#a0a0a0,bold] #S '
set -g status-left-length 20

# Right side: Date and Time
set -g status-right '#[fg=#a0a0a0,bg=#1e1e1e] %Y-%m-%d │ #[fg=#ffffff,bg=#1e1e1e,bold]%H:%M:%S '

# Active/Inactive Window Tabs
setw -g window-status-current-style bg="#333333",fg="#ffffff",bold
setw -g window-status-style bg="#1e1e1e",fg="#a0a0a0"
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "

# Pane Borders (Subtle industrial lines)
set -g pane-border-style fg="#333333"
set -g pane-active-border-style fg="#a0a0a0"

# Message and Copy Mode colors
set -g message-style bg="#a0a0a0",fg="#1e1e1e",bold
setw -g mode-style bg="#4a4a4a",fg="#ffffff",bold

# --- PENTEST WORKFLOW ---
set -g history-limit 10000
setw -g monitor-activity on
set -g visual-activity off

# Reload config shortcut
bind r source-file ~/.tmux.conf \; display-message "Minimalist Config Reloaded!"

# Improved splitting
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Synchronize Panels
bind-key S setw synchronize-panes

# --- REVERSE SHELL STABILIZATION ---
setenv -g py3 "python3 -c 'import pty;pty.spawn(\"/bin/bash\")'"
setenv -g shellexports "export TERM=xterm"

bind C-q send $py3 Enter
bind -n C-q send "stty raw -echo; fg" Enter $shellexports Enter
